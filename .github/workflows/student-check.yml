name: Student check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  basic-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show repository structure
        run: |
          echo "Estructura bàsica del repositori:"
          find . -maxdepth 2 -type f | sort

      - name: Check recommended files and folders
        run: |
          echo "Comprovació pedagògica del repositori"
          echo

          if [ -f "README.md" ]; then
            echo "OK: README.md present"
          else
            echo "AVÍS: falta README.md"
          fi

          if [ -f "docs/ai-log.md" ]; then
            echo "OK: docs/ai-log.md present"
          else
            echo "AVÍS: falta docs/ai-log.md"
          fi

          if [ -d "src" ]; then
            echo "OK: carpeta src/ present"
          else
            echo "AVÍS: falta la carpeta src/"
          fi

          if [ -d "tests" ]; then
            echo "OK: carpeta tests/ present"
          else
            echo "AVÍS: falta la carpeta tests/"
          fi

          if [ -d "evidence" ]; then
            echo "OK: carpeta evidence/ present"
          else
            echo "AVÍS: falta la carpeta evidence/"
          fi

          echo
          echo "La comprovació ha acabat. Estos avisos no bloquegen el repositori."